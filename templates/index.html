<!DOCTYPE html>
<html>

<head>
    <title>Vélo info</title>
    <link rel="icon" href="pub/favicon.ico" />
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script type="importmap">
        {
            "imports": {
                "@material/web/": "/node_modules/@material/web/",
                "lit": "/node_modules/lit/index.js",
                "lit/": "/node_modules/lit/",
                "tslib": "/node_modules/tslib/tslib.es6.js",
                "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
                "@lit/reactive-element/": "/node_modules/@lit/reactive-element/",
                "lit-html": "/node_modules/lit-html/lit-html.js",
                "lit-html/": "/node_modules/lit-html/",
                "lit-element/": "/node_modules/lit-element/"
            }
        }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <link href="/node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
    <script type="module">
        import * as maplibregl from '/node_modules/maplibre-gl/dist/maplibre-gl.mjs';

    <script src="/custom-elements/vi-main.js" type="module"></script>
    <link href="/pub/veloinfo.css" rel="stylesheet" />
    <link href="/pub/webmanifest.json" rel="manifest" />

</head>
<vi-main></vi-main>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/pub/service-worker.js', { scope: '/' })
            .catch(err => console.warn('Service Worker registration failed:', err));
    }
</script>

</html>
