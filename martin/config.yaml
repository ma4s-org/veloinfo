# Configuration Martin.
#
# Les tuiles sont gardées en mémoire. Les URL des travaux contiennent une
# version (`?v=<date>-<max_id>-<count>`) qui change à chaque import : le
# navigateur et le CDN renouvellent donc leurs tuiles sans qu'on ait à vider
# un cache. Sans ce cache, chaque déplacement de carte redemandait toutes les
# tuiles à PostgreSQL.
cache:
  size_mb: 1024
  # Martin 1.6 ne tient pas compte de la query dans sa clé de cache : ce délai
  # borne donc la fraîcheur côté serveur. Après un import manuel, les tuiles
  # restent au plus une heure en cache.
  expiry: 1h
  idle_timeout: 6h
postgres:
  connection_string: ${DATABASE_URL}
  auto_publish: true
  tables:
    road_work:
      schema: public
      table: road_work
      srid: 3857
      geometry_column: geom
      geometry_type: GEOMETRY
      # Bornes explicites : Martin calcule sinon les bornes au démarrage à
      # partir du contenu de la table. Comme les travaux sont remplacés tous
      # les jours sans redémarrer Martin, une nouvelle ville importée resterait
      # invisible tant que le serveur de tuiles n'aurait pas été redémarré.
      # Ces bornes couvrent le sud du Québec (Montréal, Westmount, Québec).
      bounds: [-79.8, 44.0, -63.0, 51.0]
      properties:
        id: int4
        start_date: date
        end_date: date
        source: text
