# Configuration Martin.
#
# La source road_work est exclue du cache interne de Martin : les travaux
# peuvent changer en cours de journée et doivent toujours être relus depuis
# PostgreSQL. Les autres sources gardent le cache par défaut.
postgres:
  connection_string: ${DATABASE_URL}
  auto_publish: true
  tables:
    road_work:
      schema: public
      table: road_work
      srid: 3857
      geometry_column: geom
      geometry_type: GEOMETRY
      # Bornes explicites : Martin calcule sinon les bornes au démarrage à
      # partir du contenu de la table. Comme les travaux sont remplacés tous
      # les jours sans redémarrer Martin, une nouvelle ville importée resterait
      # invisible tant que le serveur de tuiles n'aurait pas été redémarré.
      # Ces bornes couvrent le sud du Québec (Montréal, Westmount, Québec).
      bounds: [-79.8, 44.0, -63.0, 51.0]
      properties:
        id: int4
        start_date: date
        end_date: date
        source: text
      cache: disable
