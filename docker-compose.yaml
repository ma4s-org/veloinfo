services:
  veloinfo:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/app:Z
      - root:/root/.local:z
      - target:/app/target
      - node_modules:/app/node_modules
      - images:/images
    ports:
      - 3000:3000
      - 3002:3002
    environment:
      - IMAGE_DIR=/images
      - PGUSER=postgres
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/carte
      - MARTIN_URL=http://martin:3000
      - KEYCLOAK_BROWSER_URL=https://keycloak.veloinfo.ca/realms/master
      - KEYCLOAK_SERVER_URL=https://keycloak.veloinfo.ca/realms/master
      - VELOINFO_URL=http://localhost:3000
      - ENV=dev
    depends_on:
      - db
  martin:
    image: ghcr.io/maplibre/martin:1.6.0
    volumes:
      - ./martin/fonts:/fonts/:z
      - ./martin/config.yaml:/config.yaml:ro,z
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/carte
    ports:
      - 3001:3000
    depends_on:
      - db
      - veloinfo
    entrypoint: martin --config /config.yaml --font /fonts
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: carte
      POSTGRES_PASSWORD: postgres
    volumes:
      - db:/var/lib/postgresql/data:z
    ports:
      - 5432:5432
    command: postgres -c max_connections=250
volumes:
  root:
  db:
  target:
  node_modules:
  images:


